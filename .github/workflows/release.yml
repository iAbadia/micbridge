name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create a draft release (select a version tag as the run ref)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: dist:win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            command: dist:linux
            arch: x64
          - os: macos-latest
            platform: macos
            command: dist:mac
            arch: arm64
          - os: macos-latest
            platform: macos
            command: dist:mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      CREATE_DRAFT: ${{ github.event_name == 'push' || inputs.create_draft }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          const tag = process.env.RELEASE_TAG;
          if (tag && tag !== `v${version}`) throw Error('Version tag does not match package.json');
          if (process.env.CREATE_DRAFT === 'true' && !/^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(tag)) throw Error('Select a valid version tag to create a draft');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Windows'
        run: dotnet publish native/Micbridge.Driver/Micbridge.Driver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native/bin
      - run: node scripts/release-notices.mjs
      - run: npm run ${{ matrix.command }} -- --${{ matrix.arch }}
      - run: node scripts/release-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    if: github.event_name == 'push' || inputs.create_draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release/assets
      - run: node scripts/release-assets.mjs --checksums
      - name: Create or update draft preview
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>release-error.log; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) throw Error("Refusing to replace a published release")'
            gh release upload "$RELEASE_TAG" release/assets/* --clobber
          else
            notes="docs/RELEASE-$RELEASE_TAG.md"
            if [ ! -f "$notes" ]; then notes="docs/RELEASE-NOTES.md"; fi
            gh release create "$RELEASE_TAG" release/assets/* --verify-tag --draft --prerelease --title "Micbridge $RELEASE_TAG — preview" --notes-file "$notes"
          fi
