name: Windows audio integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audio:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/prepare-vb-cable.mjs
      - name: Stage the same driver resources used by the installer
        shell: pwsh
        run: |
          $target = 'release/win-unpacked/resources/vb-cable'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item .tools/vb-cable-package/* $target -Recurse -Force
          Get-ChildItem native/vb-cable -File | Where-Object Extension -in '.ps1', '.cs' | Copy-Item -Destination $target
      - name: Install driver, rename microphone and test PCM roundtrip
        shell: pwsh
        run: ./scripts/test-vb-cable-install.ps1
