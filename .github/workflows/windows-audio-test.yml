name: Windows audio integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audio:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/release-notices.mjs
      - run: npm run package -- --x64
      - name: Install driver, rename microphone and test PCM roundtrip
        shell: pwsh
        run: ./scripts/test-vb-cable-install.ps1
