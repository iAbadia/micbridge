name: Bug report
description: Report a reproducible problem with capture, pairing, or desktop audio.
body:
  - type: markdown
    attributes:
      value: "Remove pairing codes, cookies, admin URLs, private keys, personal recordings, and local addresses from attachments."
  - type: input
    id: version
    attributes:
      label: Micbridge version
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Desktop, phone, and browser versions
      description: Include the audio output route and whether the phone screen was locked.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error messages or screenshots
